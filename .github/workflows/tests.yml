name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run suite
        run: |
          HOME="$(mktemp -d)" PYTHONDONTWRITEBYTECODE=1 \
            python -m unittest discover -s tests -p "test_*.py" -t .
  shell-and-node-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck install.sh scripts/capability-registry
      - name: node --check
        run: node --check scripts/capability-catalog.mjs
