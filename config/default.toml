# Generic router-local defaults. Bare commands run without a project overlay.
# Set default_project to the stem of a config/<name>.toml file to select one by default.
default_project = ""
output_dir = "~/.agents/capabilities"
claude_json_path = "~/.claude.json"

[project]
name = ""
snapshot_dir = "~/.local/state/cap/snapshots"
catalog_path = "~/.local/state/cap/CAPABILITIES-DETAIL.md"
mcp_config_paths = []
surface_roots = []
cwd = ".."
first_party_roots = [".."]
hermes_project_source = "../skills"
skill_catalog_csv = "~/.local/state/cap/SKILL-CATALOG.csv"

[hermes]
profiles = []
shared_surface_root = "~/.hermes/cap-shared-skills"

[extensions]
# Copy the read-only seeds in data/snapshots into the machine-local state dir
# on first use, so a fresh clone can build an index before snapshot-runtimes.
seed_snapshots = true
